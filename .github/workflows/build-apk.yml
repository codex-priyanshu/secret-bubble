name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Secret-Bubble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm install

      - name: Build Web Application
        working-directory: ./web
        run: npm run build

      - name: Make Gradlew Executable
        run: chmod +x ./web/android/gradlew

      - name: Sync Capacitor Android
        working-directory: ./web
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: npm run cap:sync

      - name: Build Debug APK with Gradle
        working-directory: ./web/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release-apk
          cp ./web/android/app/build/outputs/apk/debug/app-debug.apk release-apk/Secret-Bubble.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Secret-Bubble-Android-APK
          path: release-apk/Secret-Bubble.apk
          retention-days: 30

