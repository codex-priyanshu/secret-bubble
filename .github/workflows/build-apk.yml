name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Secret-Bubble APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses and Setup Platform
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm install

      - name: Build Web Application
        working-directory: ./web
        run: npm run build

      - name: Copy Web Assets to Android
        working-directory: ./web
        run: npx @capacitor/cli copy android

      - name: Make Gradlew Executable
        run: chmod +x ./web/android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./web/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release-apk
          cp ./web/android/app/build/outputs/apk/debug/app-debug.apk release-apk/Secret-Bubble.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Secret-Bubble-Android-APK
          path: release-apk/Secret-Bubble.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Secret-Bubble v1.0.0 (Native Android APK)"
          body: "Official standalone native Android APK for Secret-Bubble. Tap the APK file to download directly onto your device."
          files: release-apk/Secret-Bubble.apk

