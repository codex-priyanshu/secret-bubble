name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Secret-Bubble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: ./web
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: ./web
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./web/android/gradlew

      - name: Build Android Debug APK
        working-directory: ./web/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-apk
          cp ./web/android/app/build/outputs/apk/debug/app-debug.apk release-apk/Secret-Bubble.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Secret-Bubble-Android-APK
          path: release-apk/Secret-Bubble.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == "refs/heads/main"
        with:
          tag_name: android-latest
          name: "Secret-Bubble Android App (.apk)"
          body: |
            ## Secret-Bubble Official Android APK

            Download and install the native Android APK file directly on your phone.

            ### Features:
            - **Native Android App**: Full screen, offline music player, continuous background audio.
            - **Stealth Camouflage**: Disguised as Music Lounge with secret PIN unlock vault.
            - **Encrypted Chat & Calls**: End-to-end encrypted private messaging & WebRTC audio/video calling.

            ### Installation Instructions:
            1. Download `Secret-Bubble.apk` from Assets below.
            2. Tap the downloaded file on your Android device.
            3. Tap **Install** (Allow installation from browser / unknown sources if prompted).
            4. Launch Secret-Bubble!
          files: release-apk/Secret-Bubble.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

